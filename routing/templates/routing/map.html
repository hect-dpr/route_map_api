<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route &amp; Fuel Stops</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #3d9cf0;
      --fuel: #f0a33d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100vh;
    }
    aside {
      background: var(--panel);
      padding: 1.25rem;
      overflow-y: auto;
      border-right: 1px solid #2a3548;
    }
    h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
    .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 0.55rem 0;
      border-bottom: 1px solid #2a3548;
      font-size: 0.95rem;
    }
    .stat strong { color: var(--accent); }
    .stop {
      margin-top: 0.85rem;
      padding: 0.75rem;
      background: #121a26;
      border-radius: 8px;
      border-left: 3px solid var(--fuel);
      font-size: 0.85rem;
    }
    .stop h3 { margin: 0 0 0.35rem; font-size: 0.9rem; }
    .stop .price { color: var(--fuel); font-weight: 600; }
    #map { height: 100%; width: 100%; }
    a { color: var(--accent); }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 55vh; }
      aside { max-height: 45vh; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Fuel-optimized route</h1>
    <p class="meta">{{ start }} → {{ finish }}</p>
    <div class="stat"><span>Distance</span><strong>{{ distance_miles }} mi</strong></div>
    <div class="stat"><span>Fuel stops</span><strong>{{ stops_count }}</strong></div>
    <div class="stat"><span>Total fuel cost</span><strong>${{ total_cost }}</strong></div>
    <div class="stat"><span>Assumptions</span><span>500 mi range · 10 MPG</span></div>
    <div id="stops"></div>
    <p class="meta" style="margin-top:1.5rem">
      Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
      · Tiles © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>
      · Routing © <a href="http://project-osrm.org" target="_blank" rel="noopener">OSRM</a>
    </p>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const data = {{ result_json|safe }};
    const map = L.map('map');
    // Do not use tile.openstreetmap.org — their usage policy blocks most apps (403).
    // CARTO basemaps are free for this and still use OSM data.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4mb9_1_52bcffefd177931ac853247e', {
      maxZoom: 20,
      subdomains: 'abcd',
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
        '&copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    const routeLayer = L.geoJSON(data.route_geojson, {
      style: { color: '#3d9cf0', weight: 5, opacity: 0.9 }
    }).addTo(map);

    const start = data.start;
    const finish = data.finish;

    function pinIcon(color) {
      return L.icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    L.marker([start.latitude, start.longitude], { icon: pinIcon('green') }).addTo(map)
      .bindPopup(`<b>Start</b><br>${start.display_name || start.input}`);
    L.marker([finish.latitude, finish.longitude], { icon: pinIcon('red') }).addTo(map)
      .bindPopup(`<b>Finish</b><br>${finish.display_name || finish.input}`);

    const fuelIcon = L.divIcon({
      className: '',
      html: '<div style="background:#f0a33d;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px #000"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    const stopsEl = document.getElementById('stops');
    data.fuel.stops.forEach((s, i) => {
      L.marker([s.latitude, s.longitude], { icon: fuelIcon }).addTo(map)
        .bindPopup(
          `<b>#${i + 1} ${s.name}</b><br>${s.city}, ${s.state}<br>` +
          `$${s.retail_price.toFixed(3)}/gal · ${s.gallons_purchased} gal · $${s.cost.toFixed(2)}<br>` +
          `Route mile ${s.route_mile}`
        );
      stopsEl.insertAdjacentHTML('beforeend', `
        <div class="stop">
          <h3>#${i + 1} ${s.name}</h3>
          <div>${s.city}, ${s.state} · mile ${s.route_mile}</div>
          <div class="price">$${s.retail_price.toFixed(3)}/gal · ${s.gallons_purchased} gal · $${s.cost.toFixed(2)}</div>
        </div>`);
    });

    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
  </script>
</body>
</html>
